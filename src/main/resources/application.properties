# Nombre de la aplicación
spring.application.name=invitarlyweb

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://srv1216.hstgr.io:3306/u193335285_invitarly?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging para ver las consultas SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tokens de Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN}
MERCADOPAGO_PUBLIC_KEY=${MP_PUBLIC_KEY}

# Configuración de correo con Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8



invitarly.notificacion.email=${MAIL_NOTIFICACIONES}

logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG

# Clave JWT en base64 (ejemplo)
jwt.secret=${JWT_SECRET_BASE64}

# Tiempo de expiración en milisegundos (opcional)
jwt.expirationMs=3600000

admin.user=${ADMIN_USER}
admin.pass=${ADMIN_PASS}